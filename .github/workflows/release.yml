name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  check:
    name: Find unpublished versions
    runs-on: ubuntu-latest
    if: ${{ vars.REGISTRY_PUBLISH_ENABLED == 'true' }}
    permissions:
      contents: read
    outputs:
      files: ${{ steps.pending.outputs.files }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare server.json versions with the registry
        id: pending
        run: |
          pending=""
          for dir in plugins/us plugins/eu; do
            name=$(jq -r .name "$dir/server.json")
            version=$(jq -r .version "$dir/server.json")
            plugin_version=$(jq -r .version "$dir/.claude-plugin/plugin.json")
            if [ "$version" != "$plugin_version" ]; then
              echo "::error file=$dir/server.json::version $version does not match $dir/.claude-plugin/plugin.json version $plugin_version"
              exit 1
            fi
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/${name/\//%2F}/versions/$version")
            case "$status" in
              200) echo "$name $version is already published" ;;
              404) echo "$name $version will be published"; pending="$pending $dir/server.json" ;;
              *) echo "::error::registry returned HTTP $status for $name $version"; exit 1 ;;
            esac
          done
          echo "files=${pending# }" >> "$GITHUB_OUTPUT"

  registry:
    name: Publish to MCP Registry
    needs: check
    if: ${{ needs.check.outputs.files != '' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate
        run: ./mcp-publisher login dns --domain squaredup.com --private-key "$MCP_REGISTRY_DNS_KEY"
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}

      - name: Publish
        env:
          FILES: ${{ needs.check.outputs.files }}
        run: |
          for file in $FILES; do
            ./mcp-publisher publish "$file"
          done
